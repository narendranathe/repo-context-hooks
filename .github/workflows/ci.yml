name: CI

# SECURITY: This workflow uses `pull_request`, NOT `pull_request_target`.
# `pull_request` runs in the FORK's context — secrets are not exposed and the
# checked-out code is the PR's own changes. Do NOT migrate to
# `pull_request_target` without also gating every step that runs untrusted PR
# code behind `if: github.event.pull_request.head.repo.full_name == github.repository`.
# `pull_request_target` runs in the BASE repo context with secrets exposed and
# is the root cause of nearly every "GitHub Actions code execution" CVE.
on:
  push:
    branches: [main, "feat/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]

# Default to read-only token. Individual jobs escalate explicitly when needed
# (e.g. the test job needs `id-token: write` for Codecov OIDC). This means a
# compromised step or third-party action cannot, by default, push code, edit
# branch protections, or create releases.
permissions:
  contents: read

# Single source of truth for the "canonical repo + one matrix cell" gate that
# multiple workflows need (Codecov upload here, mkdocs deploy in #75, PyPI
# publish in #76). Reference these env vars in step `if:` predicates instead
# of hardcoding the slug or matrix axes. (audit F4.6)
env:
  CANONICAL_REPO: narendranathe/repo-context-hooks
  PRIMARY_OS: ubuntu-latest
  PRIMARY_PYTHON: "3.12"

jobs:
  test:
    permissions:
      contents: read
      id-token: write   # Codecov tokenless OIDC upload only

    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Python 3.13 added per audit F1.7 — gate must run on the latest stable.
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        # Coverage gate (`fail_under = 80`) is enforced via `[tool.coverage.report]`
        # in pyproject.toml — single source of truth, no `--cov-fail-under` here.
        # See ``docs/coverage-and-property-tests.md`` for the threshold rationale
        # and the planned ratchet to 85%. (audit F5.3)
        run: python -m pytest tests/ -q --tb=short --cov=repo_context_hooks --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        # Only upload from the canonical repo + a single matrix cell to avoid Nx uploads
        # and to keep fork CIs green (forks have no Codecov enrollment).
        if: github.repository == env.CANONICAL_REPO && matrix.os == env.PRIMARY_OS && matrix.python-version == env.PRIMARY_PYTHON
        # Pinned to a 40-char SHA (v4.6.0) so a moved tag cannot inject malicious
        # JS into our CI. Bump via Dependabot or manual SHA refresh.
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97  # v4.6.0
        # Locked-down corporate / mirrored CI runners can hard-fail on TLS to
        # codecov.io. The gate is informational, not load-bearing — never block
        # a green test run on the upload.
        continue-on-error: true
        timeout-minutes: 3
        with:
          files: ./coverage.xml
          slug: narendranathe/repo-context-hooks
          fail_ci_if_error: false

  install-smoke-test:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: pip install build && python -m build --wheel

      - name: Install from wheel
        run: pip install --find-links=dist repo-context-hooks

      - name: Set up temp dirs (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          AGENT_HOME=$(mktemp -d)
          REPO_ROOT=$(mktemp -d)
          git init "$REPO_ROOT"
          echo "AGENT_HOME=$AGENT_HOME" >> "$GITHUB_ENV"
          echo "REPO_ROOT=$REPO_ROOT" >> "$GITHUB_ENV"

      - name: Set up temp dirs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $AGENT_HOME = New-Item -ItemType Directory -Path ([System.IO.Path]::Combine($env:TEMP, [System.IO.Path]::GetRandomFileName())) | Select-Object -ExpandProperty FullName
          $REPO_ROOT = New-Item -ItemType Directory -Path ([System.IO.Path]::Combine($env:TEMP, [System.IO.Path]::GetRandomFileName())) | Select-Object -ExpandProperty FullName
          git init "$REPO_ROOT"
          # Store Windows-native paths so Python and bash both resolve correctly.
          Add-Content -Path $env:GITHUB_ENV -Value "AGENT_HOME=$AGENT_HOME"
          Add-Content -Path $env:GITHUB_ENV -Value "REPO_ROOT=$REPO_ROOT"

      - name: Run install via CLI (Claude, temp home) - Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # HOME is used by Python's Path.home() on Linux/Mac.
          export HOME="$AGENT_HOME"
          repo-context-hooks install --platform claude
          echo "CLI install completed"

      - name: Run install via CLI (Claude, temp home) - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # USERPROFILE is used by Python's Path.home() on Windows.
          $env:USERPROFILE = $env:AGENT_HOME
          $env:HOMEDRIVE = Split-Path $env:AGENT_HOME -Qualifier
          $env:HOMEPATH = (Split-Path $env:AGENT_HOME -NoQualifier)
          repo-context-hooks install --platform claude
          Write-Host "CLI install completed"

      - name: Run doctor via CLI and assert exit 0 - Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$AGENT_HOME"
          repo-context-hooks doctor --platform claude --repo-root "$REPO_ROOT"
          echo "doctor exited 0 - OK"

      - name: Run doctor via CLI and assert exit 0 - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = $env:AGENT_HOME
          $env:HOMEDRIVE = Split-Path $env:AGENT_HOME -Qualifier
          $env:HOMEPATH = (Split-Path $env:AGENT_HOME -NoQualifier)
          repo-context-hooks doctor --platform claude --repo-root $env:REPO_ROOT
          Write-Host "doctor exited 0 - OK"

      - name: Verify settings.json contains hook entries - Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          SETTINGS="$AGENT_HOME/.claude/settings.json"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.json missing at $SETTINGS"
            exit 1
          fi
          echo "--- settings.json contents ---"
          cat "$SETTINGS"
          echo "--- end ---"
          if ! grep -q '"command"' "$SETTINGS"; then
            echo "FAIL: settings.json has no hook entries with 'command' key"
            exit 1
          fi
          echo "settings.json contains hook entries with 'command' - OK"

      - name: Verify settings.json contains hook entries - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $SETTINGS = Join-Path $env:AGENT_HOME ".claude\settings.json"
          if (-not (Test-Path $SETTINGS)) {
            Write-Error "FAIL: settings.json missing at $SETTINGS"
            exit 1
          }
          $content = Get-Content $SETTINGS -Raw
          Write-Host "--- settings.json contents ---"
          Write-Host $content
          Write-Host "--- end ---"
          if ($content -notmatch '"command"') {
            Write-Error "FAIL: settings.json has no hook entries with 'command' key"
            exit 1
          }
          Write-Host "settings.json contains hook entries with 'command' - OK"
          if ($content -match '\\\\') {
            Write-Error "Backslash paths found in settings.json - Windows path bug"
            exit 1
          }
          Write-Host "No backslash paths - OK"

  platform-matrix:
    name: Platform matrix (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [claude, cursor, codex, replit, windsurf, lovable, openclaw, ollama, kimi]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Install platform ${{ matrix.platform }} and run doctor
        shell: bash
        run: |
          AGENT_HOME=$(mktemp -d)
          REPO_ROOT=$(mktemp -d)
          git init "$REPO_ROOT"
          git -C "$REPO_ROOT" config user.email "ci@test.local"
          git -C "$REPO_ROOT" config user.name "CI"
          python -c "
          from pathlib import Path
          from repo_context_hooks.installer import install_platform

          platform = '${{ matrix.platform }}'
          home = Path('$AGENT_HOME')
          repo = Path('$REPO_ROOT')

          result = install_platform(platform, repo_root=repo, home=home, force=True)
          print(f'Platform: {platform}')
          print(f'Summary: {result.summary}')
          print(f'Home statuses: {result.home_statuses}')
          print(f'Warnings: {result.warnings}')
          "
          echo "Install succeeded for ${{ matrix.platform }}"
