site_name: repo-context-hooks
site_description: Hook-based repo context continuity for coding agents
site_url: https://narendranathe.github.io/repo-context-hooks/
repo_url: https://github.com/narendranathe/repo-context-hooks
repo_name: narendranathe/repo-context-hooks

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tabs
    - search.suggest

plugins:
  - search
  # `mike` versions the live docs site. The first snapshot is 1.0.0; older
  # snapshots are added by `mike deploy <version>` runs from the publish
  # workflow on tag. Building the site locally without `mike` installed
  # works because the plugin only kicks in at deploy time — the local
  # `mkdocs build --strict` precheck in CI does NOT require mike at runtime
  # (we do not call mike commands during build), so adopters who fork the
  # site without enabling mike are not blocked.
  - mike

# `extra.version` powers the version-selector dropdown in the material
# header once `mike` has deployed at least one version. Default alias is
# `latest` and is set by the publish workflow via `mike set-default --push latest`.
extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Install Guide: architecture.md
  - Troubleshooting: troubleshooting.md
  - CLI Reference: cli-reference.md
  - Stability:
      - Overview: stability.md
      - Deprecation Policy: deprecation-policy.md
  - Telemetry Policy: telemetry-policy.md
  - Monitoring: monitoring.md
  - Platforms: platforms.md
  - Platform Playbooks: platform-playbooks.md
  - Competitive Analysis: competitive-analysis.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
